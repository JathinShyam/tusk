name: tusk

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: tusk-postgres:16-postgis
    container_name: tusk-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tusk
      TUSK_MIGRATE_PASSWORD: ${TUSK_MIGRATE_PASSWORD:?set TUSK_MIGRATE_PASSWORD}
      TUSK_APP_PASSWORD: ${TUSK_APP_PASSWORD:?set TUSK_APP_PASSWORD}
    volumes:
      - tusk_pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=tusk
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tusk"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  tusk_pg_data:
